name: SAST — SonarCloud + Semgrep

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for blame/new-code detection

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Wait for SonarCloud background task to complete
        run: |
          echo "Polling SonarCloud for analysis completion..."
          for i in $(seq 1 24); do
            STATUS=$(curl -s -u "${{ secrets.SONAR_TOKEN }}:" \
              "https://sonarcloud.io/api/ce/activity?component=ryan-joyce-granite_sonarqube-semgrep-trial&ps=1" \
              | python3 -c "import sys,json; tasks=json.load(sys.stdin).get('tasks',[]); print(tasks[0]['status'] if tasks else 'PENDING')")
            echo "Attempt $i — task status: $STATUS"
            if [ "$STATUS" = "SUCCESS" ] || [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              echo "Analysis complete: $STATUS"
              break
            fi
            sleep 10
          done

      - name: Export SonarCloud issues
        run: |
          curl -s \
            -u "${{ secrets.SONAR_TOKEN }}:" \
            "https://sonarcloud.io/api/issues/search?projectKeys=ryan-joyce-granite_sonarqube-semgrep-trial&resolved=false&ps=500" \
            -o sonarcloud-issues.json
          echo "Found $(cat sonarcloud-issues.json | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d["total"])') issues"

      - name: Save SonarCloud issues as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonarcloud-issues
          path: sonarcloud-issues.json

  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/php \
            --config=p/wordpress \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --sarif \
            --output=semgrep.sarif || true

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Save SARIF as downloadable artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-sarif
          path: semgrep.sarif
